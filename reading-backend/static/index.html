<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Reading Tool - Test Page</title>
<style>
  /* Deliberately unstyled: layout only, no visual design. That happens later, elsewhere. */
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; padding: 12px; font-size: 14px; }
  #app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  #left { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  textarea { width: 100%; height: 220px; font-family: monospace; }
  #jsonOut { background: #f2f2f2; padding: 8px; overflow: auto; max-height: 500px; max-width: 100%; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  #figures { border: 1px solid #999; padding: 8px; min-height: 200px; overflow: auto; max-height: 600px; max-width: 100%; }
  #figures svg { max-width: 100%; height: auto; display: block; }
  .figure-box { max-width: 100%; overflow-x: auto; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button { cursor: pointer; }
  #warnings { background: #fff3cd; border: 1px solid #cc9900; padding: 6px; display: none; }
  #warnings.show { display: block; }
  #status { color: #555; }
  .figure-box { border: 2px solid #333; padding: 10px; margin-bottom: 16px; }
  .figure-box.arranged { border-style: dashed; }
  .figure-badge { font-size: 11px; text-transform: uppercase; color: #666; border: 1px solid #999; padding: 1px 4px; margin-left: 6px; }
  .node-card {
    border: 2px solid #333; padding: 6px; margin: 4px; display: inline-block;
    vertical-align: top; width: 170px; cursor: pointer; background: #fff;
  }
  .node-card.inferred { border-style: dashed; }
  .node-card.emphasis-1 { font-size: 11px; opacity: 0.8; }
  .node-card.emphasis-2 { font-size: 12px; }
  .node-card.emphasis-3 { font-size: 13px; font-weight: bold; border-width: 3px; }
  .node-card .label { font-weight: bold; }
  .node-card .plain { font-weight: normal; margin-top: 2px; }
  .node-card .quote { font-style: italic; margin-top: 2px; color: #444; }
  .node-card .icon { font-size: 10px; color: #888; }
  .accent-a { border-color: #b0392b; }
  .accent-b { border-color: #2969a9; }
  .accent-c { border-color: #278e50; }
  .accent-d { border-color: #7e3491; }
  .group-col { display: inline-block; vertical-align: top; border-top: 4px solid #333; padding: 6px; margin-right: 10px; min-width: 190px; }
  .group-blurb { font-size: 11px; color: #555; max-width: 190px; }
  table.comparison { border-collapse: collapse; }
  table.comparison td, table.comparison th { border: 1px solid #999; padding: 6px; text-align: left; vertical-align: top; font-size: 12px; }
  .conclusion { border-top: 1px solid #999; margin-top: 8px; padding-top: 6px; font-style: italic; }
  .glance { display: flex; gap: 16px; border: 1px solid #333; padding: 8px; flex-wrap: wrap; }
  .glance-item { min-width: 150px; }
  .glance-item .label { font-weight: bold; font-size: 11px; text-transform: uppercase; color: #555; }
  .glossary dt { font-weight: bold; margin-top: 6px; }
  .glossary dd { margin: 0 0 4px 0; }
  .stated-badge { color: #2969a9; }
  .arranged-badge { color: #b0392b; }
</style>
</head>
<body>

<div id="app">
  <div id="left">
    <h2>Reading Tool - test page</h2>
    <div id="status">loading...</div>

    <div>
      <b>Load sample:</b>
      <div id="samples" class="row"></div>
    </div>

    <div>
      <b>Force a mock fixture (no LLM call):</b>
      <div id="fixtures" class="row"></div>
    </div>

    <label>Provider:
      <select id="provider">
        <option value="">server default</option>
        <option value="mock">mock</option>
        <option value="groq">live (groq)</option>
      </select>
    </label>

    <label>Context (optional): <input id="context" style="width: 100%"></label>

    <textarea id="passage" placeholder="Paste a passage (200-8000 characters)..."></textarea>

    <div class="row">
      <button id="explainBtn">Explain</button>
      <label><input type="checkbox" id="force"> force (bypass cache)</label>
      <span id="latency"></span>
    </div>

    <div id="warnings"></div>
  </div>

  <div id="right">
    <div id="figures"><i>Nothing yet - load a sample or fixture and click Explain.</i></div>
    <pre id="jsonOut">{}</pre>
  </div>
</div>

<script>
const ICONS = {
  person: "\u{1F464}", group: "\u{1F465}", building: "\u{1F3E2}", cycle: "\u{1F501}",
  lock: "\u{1F512}", eye: "\u{1F441}", network: "\u{1F578}", brain: "\u{1F9E0}",
  gear: "⚙", money: "\u{1F4B0}", document: "\u{1F4C4}", clock: "\u{1F550}",
  warning: "⚠", scale: "⚖", layers: "\u{1F5C2}", spark: "✨",
};

let lastResponse = null;

function el(tag, opts = {}, children = []) {
  const e = document.createElement(tag);
  if (opts.class) e.className = opts.class;
  if (opts.html !== undefined) e.innerHTML = opts.html;
  if (opts.text !== undefined) e.textContent = opts.text;
  if (opts.onclick) e.addEventListener("click", opts.onclick);
  for (const c of children) e.appendChild(c);
  return e;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

async function loadSamples() {
  const res = await fetch("/api/samples");
  const samples = await res.json();
  const box = document.getElementById("samples");
  samples.forEach((s) => {
    box.appendChild(el("button", {
      text: s.title,
      onclick: () => { document.getElementById("passage").value = s.passage; document.getElementById("context").value = ""; },
    }));
  });
  window.__firstSample = samples[0] ? samples[0].passage : "x".repeat(220);
}

function fixtureButtons() {
  const forms = ["spectrum", "comparison", "concept_map", "process", "axis"];
  const box = document.getElementById("fixtures");
  forms.forEach((f) => {
    box.appendChild(el("button", {
      text: f,
      onclick: () => runExplain({ forceFixture: f }),
    }));
  });
  box.appendChild(el("button", {
    text: "agency (2 figures)",
    onclick: () => runExplain({ forceFixture: "agency" }),
  }));
}

async function loadHealth() {
  const res = await fetch("/api/health");
  const h = await res.json();
  document.getElementById("status").textContent =
    `provider: ${h.provider} | model: ${h.model} | cache entries: ${h.cache_entries}`;
}

async function runExplain(opts = {}) {
  const statusEl = document.getElementById("status");
  let passage, context, provider, force;

  if (opts.forceFixture) {
    passage = document.getElementById("passage").value.trim() || window.__firstSample || "x".repeat(220);
    context = `fixture:${opts.forceFixture}`;
    provider = "mock";
    force = true;
  } else {
    passage = document.getElementById("passage").value;
    context = document.getElementById("context").value || null;
    provider = document.getElementById("provider").value || null;
    force = document.getElementById("force").checked;
  }

  statusEl.textContent = "calling /api/explain...";
  const t0 = performance.now();
  let res, body;
  try {
    res = await fetch("/api/explain", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ passage, context, provider, force }),
    });
    body = await res.json();
  } catch (e) {
    statusEl.textContent = "request failed: " + e;
    return;
  }
  const elapsed = Math.round(performance.now() - t0);
  document.getElementById("latency").textContent = `round-trip: ${elapsed}ms`;

  if (!res.ok) {
    statusEl.textContent = `error ${res.status}`;
    document.getElementById("jsonOut").textContent = JSON.stringify(body, null, 2);
    document.getElementById("figures").innerHTML = `<b>Error ${res.status}:</b> ${escapeHtml(JSON.stringify(body.detail))}`;
    showWarnings([]);
    return;
  }

  lastResponse = body;
  statusEl.textContent = `ok | cached: ${body.meta.cached} | latency: ${body.meta.latency_ms}ms | model: ${body.meta.model}`;
  document.getElementById("jsonOut").textContent = JSON.stringify(body, null, 2);
  showWarnings(body.meta.warnings || []);
  render(body);
}

function showWarnings(warnings) {
  const box = document.getElementById("warnings");
  if (!warnings || warnings.length === 0) {
    box.classList.remove("show");
    box.innerHTML = "";
    return;
  }
  box.classList.add("show");
  box.innerHTML = "<b>Warnings:</b><ul>" + warnings.map((w) => `<li>${escapeHtml(w)}</li>`).join("") + "</ul>";
}

function highlightSpan(source) {
  if (!source || source.start == null || source.start < 0) return;
  const ta = document.getElementById("passage");
  ta.focus();
  ta.setSelectionRange(source.start, source.end);
  ta.scrollTop = 0;
}

function nodeCard(node) {
  const classes = ["node-card", `emphasis-${node.emphasis}`];
  if (node.basis === "inferred") classes.push("inferred");
  const icon = node.icon ? (ICONS[node.icon] || node.icon) : "";
  const card = el("div", {
    class: classes.join(" "),
    onclick: () => highlightSpan(node.source),
  });
  card.innerHTML = `
    <div class="label">${icon ? icon + " " : ""}${escapeHtml(node.label)}</div>
    <div class="plain">${escapeHtml(node.plain)}</div>
    ${node.quote ? `<div class="quote">&ldquo;${escapeHtml(node.quote)}&rdquo;</div>` : ""}
    <div class="icon">${node.basis}${node.icon ? " - icon:" + node.icon : ""}</div>
  `;
  return card;
}

function byId(list, id) {
  return list.find((x) => x.id === id);
}

function renderSpectrum(fig, nodes, groups) {
  const box = el("div");
  box.appendChild(el("div", {
    html: `<div style="border-top:2px solid #333;padding-top:4px;display:flex;justify-content:space-between;font-size:11px;color:#555;">
      <span>${escapeHtml(fig.layout.axis_label_low)}</span>
      <span>&#8594;</span>
      <span>${escapeHtml(fig.layout.axis_label_high)}</span>
    </div>`,
  }));
  const cols = el("div");
  fig.layout.group_order.forEach((gid) => {
    const g = byId(fig.groups, gid);
    if (!g) return;
    const col = el("div", { class: `group-col accent-${g.accent}` });
    col.appendChild(el("div", { html: `<b>${escapeHtml(g.label)}</b>` }));
    if (g.blurb) col.appendChild(el("div", { class: "group-blurb", text: g.blurb }));
    fig.node_ids
      .map((id) => byId(nodes, id))
      .filter((n) => n && n.group_id === gid)
      .forEach((n) => col.appendChild(nodeCard(n)));
    cols.appendChild(col);
  });
  box.appendChild(cols);
  return box;
}

function renderComparison(fig, nodes) {
  const dims = fig.layout.dimensions;
  const cellFor = (nodeId, dimId) => fig.layout.cells.find((c) => c.node_id === nodeId && c.dimension_id === dimId);
  const table = el("table", { class: "comparison" });
  const thead = el("tr", {}, [el("th", { text: "" }), ...dims.map((d) => el("th", { text: d.label }))]);
  table.appendChild(thead);
  fig.node_ids.forEach((nid) => {
    const n = byId(nodes, nid);
    if (!n) return;
    const tr = el("tr");
    const th = el("td", { html: `<b>${escapeHtml(n.label)}</b>` });
    th.style.cursor = "pointer";
    th.addEventListener("click", () => highlightSpan(n.source));
    tr.appendChild(th);
    dims.forEach((d) => {
      const cell = cellFor(nid, d.id);
      const td = el("td", { text: cell ? cell.text : "(missing)" });
      if (cell && cell.source) { td.style.cursor = "pointer"; td.addEventListener("click", () => highlightSpan(cell.source)); }
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  return table;
}

function svg(w, h, inner) {
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

function renderConceptMap(fig, nodes, edges) {
  const w = 480, h = 380, cx = w / 2, cy = h / 2, r = 140;
  const ids = fig.node_ids;
  const positions = {};
  ids.forEach((id, i) => {
    const angle = (2 * Math.PI * i) / ids.length - Math.PI / 2;
    positions[id] = [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
  });
  let inner = "";
  fig.edge_ids.forEach((eid) => {
    const e = byId(edges, eid);
    if (!e || !positions[e.source] || !positions[e.target]) return;
    const [x1, y1] = positions[e.source], [x2, y2] = positions[e.target];
    const dash = e.basis === "inferred" ? 'stroke-dasharray="4,3"' : "";
    inner += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#666" ${dash} />`;
    inner += `<text x="${(x1+x2)/2}" y="${(y1+y2)/2}" font-size="10" fill="#333" text-anchor="middle">${escapeHtml(e.label)}</text>`;
  });
  ids.forEach((id) => {
    const n = byId(nodes, id);
    const [x, y] = positions[id];
    inner += `<circle cx="${x}" cy="${y}" r="26" fill="#fff" stroke="#333" stroke-width="${n.emphasis === 3 ? 3 : 1.5}" ${n.basis === "inferred" ? 'stroke-dasharray="4,3"' : ""}/>`;
    inner += `<text x="${x}" y="${y}" font-size="10" text-anchor="middle" dominant-baseline="middle">${escapeHtml(n.label.slice(0, 16))}</text>`;
  });
  const box = el("div", { html: svg(w, h, inner) });
  ids.forEach((id) => {
    const n = byId(nodes, id);
    box.appendChild(nodeCard(n));
  });
  return box;
}

function renderProcess(fig, nodes) {
  const order = fig.layout.order;
  const w = Math.max(480, order.length * 150), h = 140;
  const y = h / 2;
  let inner = "";
  order.forEach((id, i) => {
    const x = 80 + i * 150;
    inner += `<rect x="${x-55}" y="${y-25}" width="110" height="50" fill="#fff" stroke="#333"/>`;
    const n = byId(nodes, id);
    inner += `<text x="${x}" y="${y}" font-size="10" text-anchor="middle" dominant-baseline="middle">${escapeHtml(n ? n.label.slice(0,18) : id)}</text>`;
    if (i < order.length - 1) {
      inner += `<line x1="${x+55}" y1="${y}" x2="${x+95}" y2="${y}" stroke="#333" marker-end="url(#arrow)"/>`;
    }
  });
  const defs = `<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker></defs>`;
  const box = el("div", { html: svg(w, h, defs + inner) });
  order.forEach((id) => { const n = byId(nodes, id); if (n) box.appendChild(nodeCard(n)); });
  return box;
}

function renderAxis(fig, nodes) {
  const w = 480, h = 420, pad = 50;
  const plotW = w - 2 * pad, plotH = h - 2 * pad - 30;
  const toX = (x) => pad + ((x + 1) / 2) * plotW;
  const toY = (y) => pad + ((1 - y) / 2) * plotH;
  let inner = `<line x1="${pad}" y1="${pad + plotH/2}" x2="${w-pad}" y2="${pad + plotH/2}" stroke="#999"/>`;
  inner += `<line x1="${pad + plotW/2}" y1="${pad}" x2="${pad + plotW/2}" y2="${pad+plotH}" stroke="#999"/>`;
  inner += `<text x="${pad}" y="${pad+plotH+16}" font-size="10">${escapeHtml(fig.layout.x.low_label)}</text>`;
  inner += `<text x="${w-pad}" y="${pad+plotH+16}" font-size="10" text-anchor="end">${escapeHtml(fig.layout.x.high_label)}</text>`;
  inner += `<text x="${pad-6}" y="${pad+plotH}" font-size="10" text-anchor="end">${escapeHtml(fig.layout.y.low_label)}</text>`;
  inner += `<text x="${pad-6}" y="${pad+10}" font-size="10" text-anchor="end">${escapeHtml(fig.layout.y.high_label)}</text>`;

  const quadRect = { tl: [pad, pad, plotW/2, plotH/2], tr: [pad+plotW/2, pad, plotW/2, plotH/2],
                      bl: [pad, pad+plotH/2, plotW/2, plotH/2], br: [pad+plotW/2, pad+plotH/2, plotW/2, plotH/2] };
  (fig.layout.empty_regions || []).forEach((er) => {
    const [rx, ry, rw, rh] = quadRect[er.quadrant];
    inner += `<foreignObject x="${rx+4}" y="${ry+4}" width="${rw-8}" height="${rh-8}">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:10px;color:#888;font-style:italic;">${escapeHtml(er.note)}</div>
    </foreignObject>`;
  });

  fig.layout.positions.forEach((p) => {
    const n = byId(nodes, p.node_id);
    const x = toX(p.x), y = toY(p.y);
    inner += `<circle cx="${x}" cy="${y}" r="7" fill="#333" ${n && n.basis === "inferred" ? 'stroke-dasharray="2,2" stroke="#333" fill="none"' : ""}/>`;
    inner += `<text x="${x+9}" y="${y+3}" font-size="10">${escapeHtml(n ? n.label : p.node_id)}</text>`;
  });

  const box = el("div", { html: svg(w, h, inner) });
  fig.layout.positions.forEach((p) => { const n = byId(nodes, p.node_id); if (n) box.appendChild(nodeCard(n)); });
  return box;
}

function renderFigure(fig, nodes, edges) {
  const box = el("div", { class: "figure-box" + (fig.provenance === "arranged" ? " arranged" : "") });
  box.appendChild(el("div", { html: `<h3 style="margin:0 0 2px 0;">${escapeHtml(fig.title)}<span class="figure-badge">${fig.form}</span><span class="figure-badge ${fig.provenance}-badge">${fig.provenance}</span></h3>` }));
  box.appendChild(el("div", { html: `<i>${escapeHtml(fig.question)}</i>` }));
  box.appendChild(el("div", { html: `<div style="margin:6px 0;">${escapeHtml(fig.caption)}</div>` }));

  let diagram;
  if (fig.form === "spectrum") diagram = renderSpectrum(fig, nodes, fig.groups);
  else if (fig.form === "comparison") diagram = renderComparison(fig, nodes);
  else if (fig.form === "concept_map") diagram = renderConceptMap(fig, nodes, edges);
  else if (fig.form === "process") diagram = renderProcess(fig, nodes);
  else if (fig.form === "axis") diagram = renderAxis(fig, nodes);
  else diagram = el("div", { text: `unknown form: ${fig.form}` });
  box.appendChild(diagram);

  box.appendChild(el("div", { html: `<div style="font-size:11px;color:#777;margin-top:6px;">form rationale: ${escapeHtml(fig.form_rationale)}</div>` }));
  if (fig.conclusion) box.appendChild(el("div", { class: "conclusion", text: fig.conclusion }));
  return box;
}

function render(resp) {
  const root = document.getElementById("figures");
  root.innerHTML = "";

  root.appendChild(el("h2", { text: resp.headline }));
  root.appendChild(el("div", { html: `<p>${escapeHtml(resp.subhead)}</p>` }));

  resp.figures.forEach((fig) => root.appendChild(renderFigure(fig, resp.nodes, resp.edges)));

  const glance = el("div", { class: "glance" });
  (resp.at_a_glance || []).forEach((h) => {
    glance.appendChild(el("div", { class: "glance-item", html: `<div class="label">${escapeHtml(h.label)}</div><div>${escapeHtml(h.value)}</div>` }));
  });
  root.appendChild(glance);

  if (resp.glossary && resp.glossary.length) {
    const dl = el("dl", { class: "glossary" });
    resp.glossary.forEach((g) => {
      const dt = el("dt", { text: g.term });
      if (g.source) { dt.style.cursor = "pointer"; dt.addEventListener("click", () => highlightSpan(g.source)); }
      dl.appendChild(dt);
      dl.appendChild(el("dd", { html: `${escapeHtml(g.plain)}<br><i>${escapeHtml(g.in_context)}</i>` }));
    });
    root.appendChild(el("h4", { text: "Glossary" }));
    root.appendChild(dl);
  }
}

document.getElementById("explainBtn").addEventListener("click", () => runExplain());
loadSamples();
fixtureButtons();
loadHealth();
</script>
</body>
</html>
