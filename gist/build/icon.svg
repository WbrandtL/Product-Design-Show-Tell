<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Matches renderer/widget.html's #icon dial exactly (52px reference,
       scaled ~16.9x): cream circle, black ring border, inner ring with a
       12-o'clock tick, center dot. This is the widget's own icon, reused as
       the app's identity - see README "Visual design". -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="440" fill="#FBF9F5" stroke="#1A1815" stroke-width="16"/>
  </g>
  <circle cx="512" cy="512" r="220" fill="none" stroke="#1A1815" stroke-opacity="0.45" stroke-width="16"/>
  <rect x="504" y="292" width="16" height="101" fill="#1A1815"/>
  <circle cx="512" cy="512" r="50" fill="#1A1815"/>
</svg>
