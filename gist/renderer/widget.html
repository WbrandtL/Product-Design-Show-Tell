<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; -webkit-user-select: none; }
  * { box-sizing: border-box; }
  body { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 7px; }

  #icon {
    position: relative; width: 52px; height: 52px; border-radius: 50%;
    border: 1px solid #1A1815; background: #FBF9F5;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background .2s ease, transform .2s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }
  #icon:hover { transform: scale(1.06); }
  #icon:active { transform: scale(0.92); }
  #icon.busy { background: #1A1815; }
  #icon.error { background: #f3d9d9; }

  #ring { position: relative; width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(26,24,21,.45); }
  #icon.busy #ring { border-color: rgba(244,240,234,.45); animation: spin 1.1s cubic-bezier(.5,0,.5,1) infinite; }
  #tick { position: absolute; left: 50%; top: 0; width: 1px; height: 6px; background: #1A1815; transform: translateX(-50%); }
  #icon.busy #tick { background: #EBD79B; }
  #dot { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; border-radius: 50%; background: #1A1815; transform: translate(-50%,-50%); animation: breathe 2.2s ease-in-out infinite; }
  #icon.busy #dot { background: #EBD79B; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(.72); } }

  #badge {
    position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 50%; background: #1A1815; border: 1px solid #F4F0EA; color: #F4F0EA;
    font: 400 10px/16px "IBM Plex Mono"; text-align: center; display: none;
  }
  #badge.show { display: block; }

  #caption {
    font: 400 8px/1 "IBM Plex Mono"; color: #1A1815; letter-spacing: .08em; text-transform: uppercase;
    text-align: center; max-width: 110px; padding: 4px 8px; border-radius: 999px;
    background: rgba(251,249,245,.92); border: 1px solid rgba(26,24,21,.35);
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default;
  }

  #open-lib {
    font: 400 8px/1 "IBM Plex Mono"; color: #F4F0EA; letter-spacing: .08em; text-transform: uppercase;
    text-align: center; padding: 4px 9px; border-radius: 999px; background: #1A1815; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.18); display: none;
  }
  #open-lib.show { display: block; }
  #open-lib:hover { background: #2b2823; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="icon" title="Select text, then click">
      <div id="ring"><span id="tick"></span><span id="dot"></span></div>
      <div id="badge">0</div>
    </div>
    <div id="caption">mark passage</div>
    <div id="open-lib">open gist</div>
  </div>
<script src="widget.js"></script>
</body>
</html>
