<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gist Backend - Test Page</title>
</head>
<body>
<h1>Gist Backend - Test Page</h1>
<p>Select 1-3 sentences of text below (at least 200 characters) to see an "Explain" button appear.</p>

<h2>Sample passage</h2>
<div id="sample-selector"></div>
<div id="passage-text" style="border: 1px solid #ccc; padding: 1em; max-width: 700px;"></div>

<div id="explain-btn-container" style="position: absolute; display: none;">
  <button id="explain-btn">Explain</button>
</div>

<h2>Or paste your own passage</h2>
<textarea id="custom-passage" rows="8" cols="80" placeholder="Paste a passage of 200-4000 characters here"></textarea><br>
<label>Mode:
  <select id="mode-select">
    <option value="understand">understand</option>
    <option value="explain_to_others">explain_to_others</option>
  </select>
</label>
<button id="custom-explain-btn">Explain custom passage</button>

<h2>Result</h2>
<div id="status"></div>
<div id="result"></div>

<script>
const state = { passages: [], currentText: "" };

async function loadSamples() {
  const res = await fetch("/v1/samples");
  const samples = await res.json();
  state.passages = samples;
  const selector = document.getElementById("sample-selector");
  samples.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.textContent = s.title;
    btn.onclick = () => showPassage(i);
    selector.appendChild(btn);
  });
  showPassage(0);
}

function showPassage(i) {
  state.currentText = state.passages[i].text;
  document.getElementById("passage-text").textContent = state.currentText;
}

document.addEventListener("mouseup", () => {
  const sel = window.getSelection();
  const text = sel.toString().trim();
  const container = document.getElementById("explain-btn-container");
  if (text.length > 0 && document.getElementById("passage-text").contains(sel.anchorNode)) {
    const range = sel.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    container.style.display = "block";
    container.style.left = (window.scrollX + rect.left) + "px";
    container.style.top = (window.scrollY + rect.bottom + 5) + "px";
    document.getElementById("explain-btn").onclick = () => runExplain(text, "understand");
  } else {
    container.style.display = "none";
  }
});

document.getElementById("custom-explain-btn").onclick = () => {
  const text = document.getElementById("custom-passage").value.trim();
  const mode = document.getElementById("mode-select").value;
  runExplain(text, mode);
};

async function runExplain(passage, mode) {
  document.getElementById("explain-btn-container").style.display = "none";
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");
  statusEl.textContent = "Calling /v1/explain ...";
  resultEl.innerHTML = "";
  try {
    const res = await fetch("/v1/explain", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ passage, mode }),
    });
    const data = await res.json();
    if (!res.ok) {
      statusEl.textContent = `Error ${res.status}: ${data.detail || JSON.stringify(data)}`;
      return;
    }
    statusEl.textContent = `OK (model=${data.meta.model}, cached=${data.meta.cached}, latency=${data.meta.latency_ms}ms, spans verified/repaired/dropped=${data.meta.spans_verified}/${data.meta.spans_repaired}/${data.meta.spans_dropped})`;
    renderResult(data);
  } catch (e) {
    statusEl.textContent = "Request failed: " + e;
  }
}

function renderResult(data) {
  const resultEl = document.getElementById("result");
  resultEl.innerHTML = "";

  const takeaway = document.createElement("p");
  takeaway.innerHTML = "<strong>Takeaway:</strong> " + escapeHtml(data.takeaway);
  resultEl.appendChild(takeaway);

  const script = document.createElement("p");
  script.innerHTML = "<strong>Explain script:</strong> " + escapeHtml(data.explain_script);
  resultEl.appendChild(script);

  const nodesHeading = document.createElement("h3");
  nodesHeading.textContent = "Nodes (by emphasis)";
  resultEl.appendChild(nodesHeading);

  const nodesById = {};
  data.nodes.forEach((n) => (nodesById[n.id] = n));

  [1, 2, 3].forEach((level) => {
    const group = data.nodes.filter((n) => n.emphasis === level);
    if (group.length === 0) return;
    const h4 = document.createElement("h4");
    h4.textContent = "Emphasis " + level;
    resultEl.appendChild(h4);
    const ul = document.createElement("ul");
    group.forEach((n) => {
      const li = document.createElement("li");
      li.textContent = `${n.label} (${n.kind}) - ${n.one_line}`;
      ul.appendChild(li);
    });
    resultEl.appendChild(ul);
  });

  const edgesHeading = document.createElement("h3");
  edgesHeading.textContent = "Edges";
  resultEl.appendChild(edgesHeading);
  const edgeList = document.createElement("ul");
  data.edges.forEach((e) => {
    const li = document.createElement("li");
    const srcLabel = nodesById[e.source] ? nodesById[e.source].label : e.source;
    const tgtLabel = nodesById[e.target] ? nodesById[e.target].label : e.target;
    li.textContent = `${srcLabel} — ${e.label} → ${tgtLabel} [${e.evidentiality}]`;
    edgeList.appendChild(li);
  });
  resultEl.appendChild(edgeList);

  const glossHeading = document.createElement("h3");
  glossHeading.textContent = "Glossary";
  resultEl.appendChild(glossHeading);
  const glossList = document.createElement("ul");
  data.glossary.forEach((g) => {
    const li = document.createElement("li");
    li.textContent = `${g.term}: ${g.plain_definition} (here: ${g.in_this_passage})`;
    glossList.appendChild(li);
  });
  resultEl.appendChild(glossList);

  const simpHeading = document.createElement("h3");
  simpHeading.textContent = "Simplifications";
  resultEl.appendChild(simpHeading);
  const simpList = document.createElement("ul");
  data.simplifications.forEach((s) => {
    const li = document.createElement("li");
    li.textContent = s;
    simpList.appendChild(li);
  });
  resultEl.appendChild(simpList);

  const details = document.createElement("details");
  const summary = document.createElement("summary");
  summary.textContent = "Raw JSON";
  details.appendChild(summary);
  const pre = document.createElement("pre");
  pre.textContent = JSON.stringify(data, null, 2);
  details.appendChild(pre);
  resultEl.appendChild(details);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

loadSamples();
</script>
</body>
</html>
