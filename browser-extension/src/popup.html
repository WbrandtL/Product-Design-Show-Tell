<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 220px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        padding: 12px 14px;
        color: #1a1d23;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #dc2626;
      }
      .dot.ok {
        background: #16a34a;
      }
      p {
        color: #6b7280;
        margin: 6px 0 0;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>TimeAware Companion</h1>
    <div class="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Checking…</span>
    </div>
    <p>Tracks the domain of your active browser tab and sends it to the TimeAware desktop app. Nothing leaves your machine.</p>
    <script src="popup.js"></script>
  </body>
</html>
